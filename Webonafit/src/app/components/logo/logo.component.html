<div
  class="logo"
  [class.logo--sm]="size() === 'sm'"
  [class.logo--md]="size() === 'md'"
  [class.logo--lg]="size() === 'lg'"
  [class.logo--inverted]="inverted()"
  role="img"
  [attr.aria-label]="showTagline() ? 'BONAFIT Wellness & Longevity' : 'BONAFIT'"
>
  <svg
    class="logo__mark"
    viewBox="0 0 120 132"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
  >
    <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path
        d="M61 6.5C94 9 114.5 36 112 71.5C109.4 108.8 84 127.5 58.5 125.2C27.5 122.4 7.8 97 10.2 64C12.6 31.2 31.4 4.2 61 6.5Z"
        stroke-width="1.7"
      />
      <path
        d="M60.8 16.5C86.4 18.6 102.2 39.4 100.2 66.2C98.1 94.5 79.2 110.6 59.4 108.8C35.8 106.7 21.2 87.2 23 61.8C24.8 37.2 38.4 14.6 60.8 16.5Z"
        stroke-width="1.45"
      />
      <path
        d="M60.4 27.2C79.2 28.8 90.6 44.2 89.1 64.4C87.5 85.4 73.8 97.4 59.2 96C41.8 94.3 31.4 79.6 32.8 61.2C34.2 43.2 43.8 25.8 60.4 27.2Z"
        stroke-width="1.3"
      />
      <path
        d="M60 38.6C72.4 39.8 80 50.2 79 63.6C78 77.4 68.6 85.6 58.8 84.6C47.2 83.4 40.4 73.2 41.4 61C42.4 49 49.2 37.6 60 38.6Z"
        stroke-width="1.2"
      />
      <path
        d="M59.6 49.4C66.8 50.2 71.2 56.4 70.6 64.2C70 72.2 64.4 77 58.6 76.4C51.6 75.6 47.6 69.6 48.2 62.2C48.8 55.2 53.2 48.8 59.6 49.4Z"
        stroke-width="1.15"
      />
      <circle cx="59.4" cy="63.2" r="4.2" fill="currentColor" stroke="none" />
    </g>
  </svg>

  <div class="logo__text">
    <span class="logo__wordmark">BON<span class="logo__a">Λ</span>FIT</span>
    @if (showTagline()) {
      <span class="logo__tagline">Wellness &amp; Longevity</span>
    }
  </div>
</div>
