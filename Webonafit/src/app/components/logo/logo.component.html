@if (imageUrl()) {
  <img
    [class]="'logo__img logo__img--' + size()"
    [src]="imageUrl()"
    [alt]="label()"
    decoding="async" />
} @else {
  <span
    class="logo__lockup"
    [class.logo__lockup--stacked]="stacked()"
    role="img"
    [attr.aria-label]="label()">
    @if (showMark()) {
      <img
        [class]="'logo__mark ' + markClass()"
        [src]="markSrc()"
        alt=""
        aria-hidden="true"
        decoding="async" />
    }
    <img
      [class]="'logo__word logo__word--' + size() + (showTagline() ? ' logo__word--tagline' : '')"
      [src]="wordSrc()"
      alt=""
      aria-hidden="true"
      decoding="async" />
  </span>
}
