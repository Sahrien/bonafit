<div
  class="logo"
  [class.logo--sm]="size() === 'sm'"
  [class.logo--md]="size() === 'md'"
  [class.logo--lg]="size() === 'lg'"
  [class.logo--inverted]="inverted()"
  [class.logo--mark]="mark() === 'mark' && !imageUrl()"
  [class.logo--photo]="isPhoto()"
  role="img"
  [attr.aria-label]="ariaLabel()"
>
  <img
    class="logo__img"
    [src]="src()"
    [alt]="ariaLabel()"
    decoding="async"
  />
</div>
