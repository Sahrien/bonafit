[project]
name = "bonafit-deploy"
version = "0.1.0"
description = "CLI to build Bonafit apps locally and upload them over FTP"
requires-python = ">=3.12"
dependencies = [
    "paramiko>=3.5.0",
    "pydantic-settings>=2.6.0",
]

[project.scripts]
deploy = "bonafit_deploy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bonafit_deploy"]
