<div class="bona-page">
  <header class="bona-page__header">
    <div>
      <h1>{{ title() }}</h1>
      @if (subtitle()) {
        <p>{{ subtitle() }}</p>
      }
    </div>
    <div class="bona-page__actions">
      <ng-content select="[bonaPageActions]" />
    </div>
  </header>

  @if (loading()) {
    <div class="bona-page__skeleton" role="status" aria-busy="true" aria-live="polite">
      <span class="bona-page__skeleton-label">{{ loadingLabel() }}</span>
      <div class="bona-page__skeleton-block"></div>
      <div class="bona-page__skeleton-block"></div>
      <div class="bona-page__skeleton-block bona-page__skeleton-block--short"></div>
    </div>
  } @else {
    <ng-content />
  }
</div>
