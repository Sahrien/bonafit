<div class="bona-grid">
  <table mat-table [dataSource]="data" class="bona-grid__table">
    @for (column of columns; track column.field) {
      <ng-container [matColumnDef]="column.field">
        <th mat-header-cell *matHeaderCellDef>{{ column.header }}</th>
        <td mat-cell *matCellDef="let row">{{ formatCell(row, column) }}</td>
      </ng-container>
    }

    @if (actions.length > 0) {
      <ng-container matColumnDef="_actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let row" class="bona-grid__actions" (click)="$event.stopPropagation()">
          @for (gridAction of actions; track gridAction.action) {
            <app-bona-button
              [text]="gridAction.label"
              variant="secondary"
              (action)="onAction(gridAction, row)" />
          }
        </td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      class="bona-grid__row"
      tabindex="0"
      (click)="onRowClick(row)"
      (keydown.enter)="onRowClick(row)"></tr>

    <tr class="bona-grid__empty-row" *matNoDataRow>
      <td class="bona-grid__empty" [attr.colspan]="displayedColumns.length">{{ emptyMessage }}</td>
    </tr>
  </table>
</div>
