<mat-form-field appearance="outline" subscriptSizing="dynamic" class="bona-input">
  @if (label) {
    <mat-label>{{ label }}</mat-label>
  }
  <input
    matInput
    class="bona-input__control"
    [name]="inputName"
    [attr.data-field-key]="inputName || null"
    [attr.autocomplete]="autocomplete || null"
    [type]="inputType()"
    [value]="value"
    [placeholder]="placeholder"
    [disabled]="disabled"
    (input)="onInput($event)"
    (blur)="onTouched()" />
  @if (isPassword()) {
    <button
      mat-icon-button
      matSuffix
      type="button"
      class="bona-input__reveal"
      [attr.aria-label]="revealLabel()"
      [attr.aria-pressed]="revealed()"
      (mousedown)="$event.preventDefault()"
      (click)="toggleReveal()">
      <mat-icon>{{ revealed() ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
  }
</mat-form-field>
