<mat-form-field appearance="outline" subscriptSizing="dynamic" class="bona-input">
  @if (label) {
    <mat-label>{{ label }}</mat-label>
  }
  <input
    matInput
    [type]="type"
    [value]="value"
    [placeholder]="placeholder"
    [disabled]="disabled"
    (input)="onInput($event)"
    (blur)="onTouched()" />
</mat-form-field>
