<app-bona-page [title]="literals.title" [subtitle]="literals.subtitle" [loading]="loading()">
  @if (error()) {
    <p class="portal-page__status portal-page__status--error">{{ error() }}</p>
  } @else {
    <app-bona-form
      [fields]="fields"
      [value]="formValue()"
      [submitText]="literals.save"
      [disabled]="saving()"
      (valueChange)="formValue.set($event)"
      (submitted)="onSave($event)" />
  }

  @if (feedback()) {
    <p class="portal-page__status">{{ feedback() }}</p>
  }
</app-bona-page>
