<app-bona-page [title]="literals.title" [subtitle]="literals.subtitle" [loading]="loading()">
  @if (error()) {
    <p class="portal-page__status portal-page__status--error">{{ error() }}</p>
  } @else {
    @if (changingId()) {
      <p class="portal-agenda__banner" role="status">{{ literals.changingBanner }}</p>
    }

    <section class="portal-agenda__section">
      <header class="portal-agenda__section-header">
        <h2>{{ literals.myAppointments }}</h2>
        @if (changingId()) {
          <app-bona-button
            [text]="literals.close"
            variant="secondary"
            (action)="onCloseChange()" />
        }
      </header>
      <app-bona-grid
        [data]="appointmentRows()"
        [columns]="appointmentColumns"
        [actions]="appointmentActions"
        [emptyMessage]="literals.emptyAppointments"
        (action)="onAppointmentAction($event)" />
    </section>

    <section class="portal-agenda__section">
      <h2>{{ literals.slots }}</h2>
      @if (bookableServices().length === 0) {
        <p class="portal-page__status">{{ literals.noService }}</p>
      } @else {
        <app-bona-form
          [fields]="filterFields()"
          [value]="filterValue()"
          [showSubmit]="false"
          (valueChange)="onFilterChange($event)" />
        <app-bona-grid
          [data]="visibleSlots()"
          [columns]="slotColumns"
          [actions]="changingId() ? changeSlotActions : slotActions"
          [emptyMessage]="literals.emptySlots"
          (action)="onSlotAction($event)" />
      }
    </section>
  }
</app-bona-page>
