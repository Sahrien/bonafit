<app-bona-page [title]="literals.title" [subtitle]="literals.subtitle" [loading]="loading()">
  @if (error()) {
    <p class="portal-page__status portal-page__status--error">{{ error() }}</p>
  } @else {
    <app-bona-grid
      [data]="rows()"
      [columns]="columns"
      [emptyMessage]="literals.empty" />
  }
</app-bona-page>
