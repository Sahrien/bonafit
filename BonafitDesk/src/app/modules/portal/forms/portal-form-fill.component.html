<app-bona-page
  [title]="assignment()?.title || literals.title"
  [subtitle]="literals.subtitle"
  [loading]="loading()">
  <app-bona-button
    bonaPageActions
    [text]="literals.back"
    variant="secondary"
    (action)="onBack()" />

  @if (!assignment() && error()) {
    <p class="portal-page__status portal-page__status--error">{{ error() }}</p>
  } @else if (isCompleted()) {
    @if (feedback()) {
      <p class="portal-page__status">{{ feedback() }}</p>
    }
    <dl class="answers">
      @for (item of answers(); track item.id) {
        <dt>{{ item.prompt }}</dt>
        <dd>{{ item.answer }}</dd>
      }
    </dl>
  } @else if (assignment()) {
    <app-form-fill-view
      [fields]="fields()"
      [value]="formValue()"
      [submitText]="literals.submit"
      [disabled]="saving()"
      [error]="error()"
      (valueChange)="onFormChange($event)"
      (submitted)="onSubmit($event)" />
    @if (feedback()) {
      <p class="portal-page__status">{{ feedback() }}</p>
    }
  }
</app-bona-page>
