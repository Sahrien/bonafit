<div class="login">
  <div class="login__card">
    <header class="login__intro">
      <div class="login__lang">
        <app-bona-language-switcher />
      </div>
      @if (brandTheme.logoHref()) {
        <img class="login__logo" [src]="brandTheme.logoHref()" [alt]="brandTheme.studioName()" />
      } @else {
        <p class="login__slogan">{{ brandTheme.slogan() }}</p>
        <p class="login__brand">{{ brandTheme.studioName() }}</p>
      }
      <h1 class="login__title">{{ literals.title }}</h1>
    </header>

    @if (error()) {
      <p class="login__error">{{ error() }}</p>
    }

    <app-bona-form
      [fields]="fields()"
      [value]="formValue()"
      [submitText]="literals.submit"
      [disabled]="submitting()"
      (valueChange)="onFormChange($event)"
      (submitted)="onSubmit($event)" />

    <button type="button" class="login__forgot" (click)="onForgotPassword()">
      {{ literals.forgotPassword }}
    </button>

    @if (resetMessage()) {
      <p class="login__success" role="status">{{ resetMessage() }}</p>
    }
    @if (resetError()) {
      <p class="login__error" role="alert">{{ resetError() }}</p>
    }
  </div>
</div>
