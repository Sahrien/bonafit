<div class="login">
  <div class="login__card">
    <header class="login__intro">
      <p class="login__slogan">{{ literals.slogan }}</p>
      <p class="login__brand">{{ literals.brand }}</p>
      <h1 class="login__title">{{ literals.title }}</h1>
    </header>

    @if (error()) {
      <p class="login__error">{{ error() }}</p>
    }

    <app-bona-form
      [fields]="fields"
      [value]="formValue()"
      [submitText]="literals.submit"
      [disabled]="submitting()"
      (valueChange)="onFormChange($event)"
      (submitted)="onSubmit($event)" />
  </div>
</div>
