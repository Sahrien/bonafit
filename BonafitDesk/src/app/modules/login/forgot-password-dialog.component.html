<app-bona-dialog-layout [title]="literals.forgotTitle">
  <p class="forgot-password__hint">{{ literals.forgotSubtitle }}</p>

  <app-bona-form
    [fields]="fields()"
    [value]="formValue()"
    [showSubmit]="false"
    (valueChange)="onFormChange($event)"
    (submitted)="onSave()" />

  <div bonaDialogActions>
    <app-bona-button [text]="literals.forgotCancel" variant="secondary" (action)="onCancel()" />
    <app-bona-button [text]="literals.forgotSend" (action)="onSave()" />
  </div>
</app-bona-dialog-layout>
