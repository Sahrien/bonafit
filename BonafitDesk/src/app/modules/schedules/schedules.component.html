<app-bona-page [title]="literals.title" [subtitle]="literals.subtitle" [loading]="loading()">
  <app-bona-tabs
    bonaPageActions
    variant="segmented"
    [tabs]="modeTabs()"
    [active]="activeMode()"
    [label]="literals.modeLabel"
    (activeChange)="onMode($event)" />

  @if (error()) {
    <p class="page-error">{{ error() }}</p>
  }

  @if (activeMode() === 'estudio') {
    <div class="schedules-hours">
      <app-bona-summary-card [kicker]="literals.hoursTotal" [title]="hoursLabel(hours().totalMinutes)" />
      <app-bona-summary-card [kicker]="literals.hoursAverage" [title]="hoursLabel(hours().averageMinutesPerDay)" />
    </div>
  }

  <div class="calendar-toolbar">
    <div class="calendar-toolbar__when">
      <app-bona-button [text]="literals.periodToday" variant="ghost" (action)="onFocusToday()" />
      <app-bona-icon-button icon="chevron_left" [label]="literals.periodPrev" (action)="onPrevPeriod()" />
      <strong>{{ periodTitle() }}</strong>
      <app-bona-icon-button icon="chevron_right" [label]="literals.periodNext" (action)="onNextPeriod()" />
    </div>
    @if (activeMode() === 'estudio' && trainerFilterItems().length > 1) {
      <app-bona-filter-menu
        [items]="trainerFilterItems()"
        [selectedIds]="selectedTrainerIds()"
        [label]="literals.trainer"
        [allLabel]="literals.allTrainers"
        [searchLabel]="literals.filterSearch"
        [emptyLabel]="literals.filterEmpty"
        (selectedChange)="onTrainerFilter($event)" />
    }
    <div class="calendar-toolbar__views">
      <app-bona-tabs
        variant="segmented"
        [tabs]="viewTabs()"
        [active]="view()"
        [label]="literals.thisPeriod"
        (activeChange)="onView($event)" />
    </div>
  </div>

  <app-bona-calendar
    [view]="view()"
    [locale]="language.language()"
    [events]="events()"
    [editable]="true"
    [eventDurationEditable]="true"
    [allDaySlot]="true"
    [showHeader]="false"
    [focusDate]="focusDate()"
    (slotSelect)="onSlotSelect($event)"
    (eventClick)="onEventClick($event)"
    (eventDrop)="onEventDrop($event)"
    (eventResize)="onEventDrop($event)" />
</app-bona-page>
