<app-bona-page [title]="literals.title" [loading]="loading()">
  <app-bona-button
    bonaPageActions
    [text]="literals.newAppointment"
    (action)="onCreate()" />

  <div class="calendar-toolbar">
    <div class="calendar-toolbar__when">
      <app-bona-button [text]="literals.dayToday" variant="ghost" (action)="onFocusToday()" />
      <app-bona-icon-button icon="chevron_left" [label]="literals.dayPrev" (action)="onPrevPeriod()" />
      <strong>{{ periodTitle() }}</strong>
      <app-bona-icon-button icon="chevron_right" [label]="literals.dayNext" (action)="onNextPeriod()" />
    </div>
    <div class="calendar-toolbar__filters">
      <app-bona-filter-menu
        [items]="serviceFilterItems()"
        [selectedIds]="selectedServiceIds()"
        [label]="literals.serviceFilter"
        [allLabel]="literals.allServices"
        [searchLabel]="literals.filterSearch"
        [emptyLabel]="literals.filterEmpty"
        (selectedChange)="onServiceFilter($event)" />
      <app-bona-filter-menu
        [items]="trainerFilterItems()"
        [selectedIds]="selectedTrainerIds()"
        [label]="literals.trainerFilter"
        [allLabel]="literals.allTrainers"
        [searchLabel]="literals.filterSearch"
        [emptyLabel]="literals.filterEmpty"
        (selectedChange)="onTrainerFilter($event)" />
    </div>
    <div class="calendar-toolbar__views">
      <app-bona-tabs
        variant="segmented"
        [tabs]="viewTabs()"
        [active]="view()"
        [label]="literals.viewLabel"
        (activeChange)="onView($event)" />
      <app-bona-tabs
        variant="segmented"
        [tabs]="displayTabs()"
        [active]="display()"
        [label]="literals.displayLabel"
        (activeChange)="onDisplay($event)" />
    </div>
  </div>

  @if (display() === 'board') {
    <app-bona-board
      [columns]="boardColumns()"
      [items]="boardItems()"
      [emptyLabel]="literals.boardEmpty"
      (itemClick)="onBoardItemClick($event)" />
  } @else if (view() === 'week') {
    <app-bona-calendar
      [locale]="language.language()"
      [view]="view()"
      [events]="events()"
      [editable]="true"
      [allDaySlot]="true"
      [showHeader]="false"
      [focusDate]="focusDate()"
      (eventClick)="onEventClick($event)"
      (slotSelect)="onSlotSelect($event)"
      (eventDrop)="onEventDrop($event)" />
  } @else {
    <div class="calendar-day-trainers">
      @for (trainer of visibleTrainers(); track trainer.id) {
        <section class="calendar-day-trainer">
          <h3>{{ trainer.name }}</h3>
          <app-bona-calendar
            view="day"
            [locale]="language.language()"
            [showHeader]="false"
            [editable]="true"
            [allDaySlot]="true"
            [focusDate]="focusDate()"
            [events]="eventsForTrainer(trainer.id)"
            (eventClick)="onEventClick($event)"
            (slotSelect)="onSlotSelectForTrainer(trainer.id, $event)"
            (eventDrop)="onEventDrop($event)" />
        </section>
      }
    </div>
  }
</app-bona-page>
