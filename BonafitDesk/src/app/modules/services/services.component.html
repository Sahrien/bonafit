<app-bona-page [title]="literals.title" [subtitle]="literals.subtitle" [loading]="loading()">
  @if (!showDetail()) {
    <app-bona-button bonaPageActions [text]="literals.newService" (action)="onCreateService()" />
  }

  @if (error()) {
    <p class="page-error">{{ error() }}</p>
  }

  <div class="services-catalog" [class.services-catalog--detail]="showDetail()">
    <div class="services-catalog__list">
      <div class="page-toolbar">
        <div class="page-toolbar__search">
          <app-bona-input-text-field
            [label]="literals.search"
            [placeholder]="literals.searchPlaceholder"
            [value]="search()"
            (valueChange)="onSearch($event)" />
        </div>
        <app-bona-field
          class="page-toolbar__sort"
          [definition]="sortField()"
          [value]="catalogSort()"
          (valueChange)="onCatalogSort($event)" />
      </div>
      <app-bona-grid
        [data]="serviceRows()"
        [columns]="serviceColumns()"
        [actions]="serviceActions()"
        [emptyMessage]="catalogEmptyMessage()"
        [emptyTitle]="literals.emptyServicesTitle"
        [emptyFilteredMessage]="literals.emptyServicesFilter"
        [emptyActionLabel]="catalogEmptyAction()"
        (emptyAction)="onCreateService()"
        (action)="onServiceAction($event)"
        (rowClick)="onServiceRowClick($event)" />
      @if (showCatalogPager()) {
        <div class="services-catalog__pager">
          <app-bona-button
            [text]="gridLiterals.previousPage"
            variant="secondary"
            [disabled]="!catalogCanPrevious()"
            (action)="onCatalogPrevious()" />
          <span>{{ catalogPageLabel() }}</span>
          <app-bona-button
            [text]="gridLiterals.nextPage"
            variant="secondary"
            [disabled]="!catalogCanNext()"
            (action)="onCatalogNext()" />
        </div>
      }
    </div>

    @if (showDetail()) {
      <section
        class="page-section page-section--save"
        [attr.aria-label]="literals.serviceEditor">
        <h2>{{ literals.serviceEditor }}</h2>
        <app-bona-form
          [fields]="serviceFields()"
          [value]="serviceForm()"
          [showSubmit]="false"
          actionsAlign="start"
          (valueChange)="onServiceFormChange($event)"
          (submitted)="onSaveService($event)" />
        <div class="page-section__save">
          <app-bona-button
            [text]="literals.close"
            variant="secondary"
            (action)="onCancelService()" />
          <app-bona-button [text]="literals.save" (action)="onSaveService(serviceForm())" />
        </div>
      </section>

      @if (!isNewService()) {
        <section class="page-section" [class.page-section--save]="bonoFormOpen()">
          <header class="page-section__header">
            <h2>{{ literals.bonosTitle }}</h2>
            <app-bona-button [text]="literals.newBono" (action)="onCreateBono()" />
          </header>
          <app-bona-grid
            [data]="selectedBonos()"
            [columns]="bonoColumns()"
            [actions]="bonoActions()"
            [emptyMessage]="literals.emptyBonos"
            (action)="onBonoAction($event)" />
          @if (bonoFormOpen()) {
            <div class="page-section__form">
              <app-bona-form
                [fields]="bonoFields()"
                [value]="bonoForm()"
                [showSubmit]="false"
                actionsAlign="start"
                (valueChange)="onBonoFormChange($event)"
                (submitted)="onSaveBono($event)" />
            </div>
            <div class="page-section__save">
              <app-bona-button
                [text]="literals.cancel"
                variant="secondary"
                (action)="onCancelBono()" />
              <app-bona-button [text]="literals.save" (action)="onSaveBono(bonoForm())" />
            </div>
          }
        </section>
      }
    }
  </div>
</app-bona-page>
