<div class="page">
  <header class="page-header">
    <div>
      <h1>{{ title() }}</h1>
      <p>{{ literals.subtitle }}</p>
    </div>
    <app-bona-button
      [text]="literals.back"
      variant="secondary"
      (action)="onBack()" />
  </header>

  @if (error()) {
    <p class="page-error">{{ error() }}</p>
  }

  <app-bona-form
    [fields]="fields"
    [value]="formValue()"
    [submitText]="literals.save"
    [disabled]="saving()"
    (valueChange)="onFormChange($event)"
    (submitted)="onSubmit($event)" />

  @if (!isNew()) {
    <section class="page-nested">
      <h2>{{ literals.bonosTitle }}</h2>
      <app-bona-grid
        [data]="bonoRows()"
        [columns]="bonoColumns"
        [actions]="bonoActions"
        [emptyMessage]="literals.emptyBonos"
        (action)="onBonoAction($event)" />
      @if (bonoFormOpen()) {
        <div class="page-nested__form">
          <app-bona-form
            [fields]="bonoFields"
            [value]="bonoForm()"
            [submitText]="literals.save"
            (valueChange)="onBonoFormChange($event)"
            (submitted)="onSaveBono($event)" />
          <app-bona-button
            [text]="literals.back"
            variant="secondary"
            (action)="onCancelBono()" />
        </div>
      }
    </section>
    <div class="page-actions">
      <app-bona-button
        [text]="literals.delete"
        variant="secondary"
        (action)="onDelete()" />
    </div>
  }
</div>
