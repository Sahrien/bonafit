<app-bona-page [title]="literals.title" [subtitle]="literals.subtitle" [loading]="loading()">
  <app-bona-button bonaPageActions [text]="literals.newClient" (action)="onCreate()" />

  <div class="page-toolbar">
    <app-bona-input-text-field
      [label]="literals.search"
      [placeholder]="literals.searchPlaceholder"
      [value]="search()"
      (valueChange)="onSearch($event)" />
  </div>

  <app-bona-grid
    [data]="rows()"
    [columns]="columns()"
    [emptyMessage]="literals.empty"
    [emptyTitle]="literals.emptyTitle"
    [emptyActionLabel]="literals.newClient"
    (emptyAction)="onCreate()"
    (rowClick)="onRowClick($event)" />
</app-bona-page>
